<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Network Speed Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #030712;
      --bg-2: #111827;
      --card: rgba(15, 23, 42, 0.72);
      --card-border: rgba(148, 163, 184, 0.2);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-a: #22d3ee;
      --accent-b: #6366f1;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.18), transparent 35%),
        radial-gradient(circle at 80% 15%, rgba(99, 102, 241, 0.2), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .card {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      backdrop-filter: blur(10px);
      padding: 22px;
      box-shadow: 0 18px 50px rgba(2, 6, 23, 0.55);
    }

    .topRow {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 3.4vw, 1.7rem);
      letter-spacing: 0.01em;
    }

    .status {
      margin: 0;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(125, 211, 252, 0.4);
      color: #bae6fd;
      background: rgba(2, 132, 199, 0.16);
      font-weight: 600;
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .main {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }

    .panel {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      background: rgba(2, 6, 23, 0.36);
      padding: 14px;
    }

    .gaugeWrap {
      display: grid;
      place-items: center;
      margin-top: 4px;
    }

    .gauge {
      width: min(360px, 100%);
      aspect-ratio: 1;
      position: relative;
    }

    .gauge svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gaugeTrack {
      fill: none;
      stroke: rgba(148, 163, 184, 0.25);
      stroke-width: 20;
    }

    .gaugeProgress {
      fill: none;
      stroke-width: 20;
      stroke-linecap: round;
      stroke: url(#gaugeGradient);
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.55));
    }

    .gaugeCenter {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }

    .gaugeValue {
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .gaugeUnit {
      color: var(--text-muted);
      margin-top: 5px;
      font-size: 0.9rem;
    }

    .gaugeMode {
      margin-top: 10px;
      color: #a5b4fc;
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .gaugeScale {
      margin-top: 10px;
      color: #bfdbfe;
      font-size: 0.82rem;
      opacity: 0.85;
    }

    .metrics {
      display: grid;
      gap: 12px;
    }

    .metric {
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.68);
      padding: 12px;
    }

    .metricLabel {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .metricValue {
      font-size: clamp(1.35rem, 5vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
    }

    .hint {
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.45;
      margin: 8px 0 0;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .controlRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    select,
    button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      font-size: 1rem;
      padding: 11px 12px;
      color: var(--text-main);
      background: rgba(30, 41, 59, 0.9);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    #start {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border-color: rgba(56, 189, 248, 0.6);
    }

    #stop {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-color: rgba(248, 113, 113, 0.6);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    @media (max-width: 860px) {
      .main {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="topRow">
      <h1>Local Network Speed Test</h1>
      <p class="status" id="status">Disconnected</p>
    </div>

    <div class="main">
      <section class="panel">
        <div class="gaugeWrap">
          <div class="gauge">
            <svg viewBox="0 0 420 420" aria-hidden="true">
              <defs>
                <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#22d3ee"></stop>
                  <stop offset="100%" stop-color="#6366f1"></stop>
                </linearGradient>
              </defs>
              <circle class="gaugeTrack" cx="210" cy="210" r="164"></circle>
              <circle class="gaugeProgress" id="gaugeProgress" cx="210" cy="210" r="164"></circle>
            </svg>
            <div class="gaugeCenter">
              <div class="gaugeValue" id="gaugeValue">0.00</div>
              <div class="gaugeUnit">Mbps</div>
              <div class="gaugeMode" id="gaugeMode">Idle</div>
              <!-- <div class="gaugeScale">Gauge Scale: 0 to 1000 Mbps</div> -->
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="metrics">
          <article class="metric">
            <div class="metricLabel">Download Speed (smoothed)</div>
            <div class="metricValue" id="downloadSpeed">0.00 Mbps</div>
          </article>

          <article class="metric">
            <div class="metricLabel">Upload Speed (smoothed)</div>
            <div class="metricValue" id="uploadSpeed">0.00 Mbps</div>
          </article>

          <article class="metric">
            <div class="metricLabel">Network Latency</div>
            <div class="metricValue" id="latency">-- ms</div>
          </article>

          <article class="metric">
            <div class="metricLabel">Network Interface</div>
            <div class="metricValue" id="networkInterface">Loading...</div>
          </article>

          <article class="metric">
            <div class="metricLabel">Active Connections</div>
            <div class="metricValue" id="activeConnections">0</div>
          </article>
        </div>

        <div class="controls">
          <select id="mode">
            <option value="both">Both (Upload + Download)</option>
            <option value="download">Download only</option>
            <option value="upload">Upload only</option>
          </select>

          <div class="controlRow">
            <button id="start">Start</button>
            <button id="stop" disabled>Stop</button>
          </div>
        </div>

        <p class="hint">
          Continuous test with no time limit. Speed keeps updating until you press Stop.
        </p>
      </section>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const downloadEl = document.getElementById('downloadSpeed');
    const uploadEl = document.getElementById('uploadSpeed');
    const latencyEl = document.getElementById('latency');
    const networkInterfaceEl = document.getElementById('networkInterface');
    const activeConnectionsEl = document.getElementById('activeConnections');
    const gaugeProgressEl = document.getElementById('gaugeProgress');
    const gaugeValueEl = document.getElementById('gaugeValue');
    const gaugeModeEl = document.getElementById('gaugeMode');
    const modeEl = document.getElementById('mode');
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');

    const uploadChunk = new Uint8Array(256 * 1024).fill(97);
    const UPLOAD_BUFFER_LOW_BYTES = 2 * 1024 * 1024;
    const UPLOAD_BUFFER_HIGH_BYTES = 8 * 1024 * 1024;
    const MAX_PACKETS_PER_PUMP = 32;
    const PUMP_DELAY_ACTIVE_MS = 1;
    const PUMP_DELAY_BACKPRESSURE_MS = 4;

    const GAUGE_MAX_MBPS = 500;
    const GAUGE_RADIUS = 164;
    const GAUGE_CIRCUMFERENCE = 2 * Math.PI * GAUGE_RADIUS;

    const DISPLAY_SMOOTH_ALPHA_UP = 0.22;
    const DISPLAY_SMOOTH_ALPHA_DOWN = 0.1;
    const GAUGE_LERP_FACTOR = 0.16;
    const SPEED_WINDOW_SIZE = 12;
    const ZERO_DROP_PROTECT_THRESHOLD_MBPS = 40;
    const ZERO_DROP_DECAY = 0.9;

    let socket = null;
    let isRunning = false;
    let uploadPumpTimer = null;
    let gaugeAnimationId = null;
    let pingInterval = null;

    let smoothedDownloadMbps = 0;
    let smoothedUploadMbps = 0;
    let targetGaugeMbps = 0;
    let visibleGaugeMbps = 0;
    let latencyMs = 0;
    let downloadSamples = [];
    let uploadSamples = [];

    gaugeProgressEl.style.strokeDasharray = `${GAUGE_CIRCUMFERENCE}`;
    gaugeProgressEl.style.strokeDashoffset = `${GAUGE_CIRCUMFERENCE}`;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function smoothValue(current, next) {
      const alpha = next >= current ? DISPLAY_SMOOTH_ALPHA_UP : DISPLAY_SMOOTH_ALPHA_DOWN;
      return current + alpha * (next - current);
    }

    function formatMbpsValue(mbps) {
      return `${mbps.toFixed(2)} Mbps`;
    }

    function pushSample(samples, value) {
      samples.push(value);
      if (samples.length > SPEED_WINDOW_SIZE) {
        samples.shift();
      }
    }

    function averageSamples(samples) {
      if (samples.length === 0) {
        return 0;
      }
      const total = samples.reduce((sum, item) => sum + item, 0);
      return total / samples.length;
    }

    function stabilizeDropToZero(rawMbps, previousSmoothedMbps) {
      if (rawMbps < 1 && previousSmoothedMbps >= ZERO_DROP_PROTECT_THRESHOLD_MBPS) {
        return previousSmoothedMbps * ZERO_DROP_DECAY;
      }
      return rawMbps;
    }

    function renderGauge(mbps) {
      const clamped = Math.max(0, Math.min(mbps, GAUGE_MAX_MBPS));
      const ratio = clamped / GAUGE_MAX_MBPS;
      const offset = GAUGE_CIRCUMFERENCE * (1 - ratio);
      gaugeProgressEl.style.strokeDashoffset = `${offset}`;
      gaugeValueEl.textContent = mbps.toFixed(2);
    }

    function startGaugeAnimator() {
      if (gaugeAnimationId) {
        return;
      }

      const frame = () => {
        visibleGaugeMbps += (targetGaugeMbps - visibleGaugeMbps) * GAUGE_LERP_FACTOR;
        if (Math.abs(visibleGaugeMbps - targetGaugeMbps) < 0.03) {
          visibleGaugeMbps = targetGaugeMbps;
        }
        renderGauge(visibleGaugeMbps);
        gaugeAnimationId = requestAnimationFrame(frame);
      };

      gaugeAnimationId = requestAnimationFrame(frame);
    }

    function stopGaugeAnimator() {
      if (!gaugeAnimationId) {
        return;
      }
      cancelAnimationFrame(gaugeAnimationId);
      gaugeAnimationId = null;
    }

    function updateGaugeModeLabel() {
      if (!isRunning) {
        gaugeModeEl.textContent = 'Idle';
        return;
      }

      if (modeEl.value === 'upload') {
        gaugeModeEl.textContent = 'Upload';
        return;
      }

      if (modeEl.value === 'download') {
        gaugeModeEl.textContent = 'Download';
        return;
      }

      gaugeModeEl.textContent = 'Both (Higher of two)';
    }

    function resetDisplays() {
      smoothedDownloadMbps = 0;
      smoothedUploadMbps = 0;
      targetGaugeMbps = 0;
      visibleGaugeMbps = 0;
      latencyMs = 0;
      downloadSamples = [];
      uploadSamples = [];
      downloadEl.textContent = formatMbpsValue(0);
      uploadEl.textContent = formatMbpsValue(0);
      latencyEl.textContent = '-- ms';
      activeConnectionsEl.textContent = '0';
      renderGauge(0);
    }

    function sendJson(message) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }
      socket.send(JSON.stringify(message));
    }

    function startPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
      }

      pingInterval = setInterval(() => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          sendJson({
            type: 'ping',
            timestamp: Date.now()
          });
        }
      }, 2000); // Ping every 2 seconds
    }

    function stopPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }
    }

    async function loadNetworkInfo() {
      try {
        const response = await fetch('/network-info');
        const data = await response.json();

        const activeInterfaces = Object.entries(data.interfaces)
          .filter(([name, interfaces]) =>
            interfaces.some(iface => iface.family === 'IPv4' && !iface.internal)
          );

        if (activeInterfaces.length > 0) {
          const interfaceNames = activeInterfaces.map(([name]) => name).join(', ');
          networkInterfaceEl.textContent = interfaceNames;
        } else {
          networkInterfaceEl.textContent = 'No network detected';
        }
      } catch (error) {
        networkInterfaceEl.textContent = 'Unknown';
      }
    }

    function stopUploadLoop() {
      if (uploadPumpTimer !== null) {
        clearTimeout(uploadPumpTimer);
        uploadPumpTimer = null;
      }
    }

    function scheduleUploadPump() {
      if (uploadPumpTimer !== null) {
        return;
      }

      uploadPumpTimer = setTimeout(() => {
        uploadPumpTimer = null;
        runUploadPump();
      }, 0);
    }

    function runUploadPump() {
      if (!isRunning || !socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }

      const mode = modeEl.value;
      if (mode !== 'upload' && mode !== 'both') {
        return;
      }

      if (socket.bufferedAmount >= UPLOAD_BUFFER_HIGH_BYTES) {
        uploadPumpTimer = setTimeout(() => {
          uploadPumpTimer = null;
          runUploadPump();
        }, PUMP_DELAY_BACKPRESSURE_MS);
        return;
      }

      let packetsSent = 0;
      while (
        socket.bufferedAmount < UPLOAD_BUFFER_LOW_BYTES &&
        packetsSent < MAX_PACKETS_PER_PUMP &&
        isRunning &&
        socket.readyState === WebSocket.OPEN
      ) {
        socket.send(uploadChunk);
        packetsSent += 1;
      }

      uploadPumpTimer = setTimeout(() => {
        uploadPumpTimer = null;
        runUploadPump();
      }, PUMP_DELAY_ACTIVE_MS);
    }

    function startUploadLoop() {
      stopUploadLoop();
      scheduleUploadPump();
    }

    function applyMetrics(downloadBps, uploadBps, globalStats) {
      const rawDownloadMbps = (downloadBps * 8) / 1_000_000;
      const rawUploadMbps = (uploadBps * 8) / 1_000_000;

      const stabilizedDownload = stabilizeDropToZero(rawDownloadMbps, smoothedDownloadMbps);
      const stabilizedUpload = stabilizeDropToZero(rawUploadMbps, smoothedUploadMbps);

      pushSample(downloadSamples, stabilizedDownload);
      pushSample(uploadSamples, stabilizedUpload);

      const averagedDownload = averageSamples(downloadSamples);
      const averagedUpload = averageSamples(uploadSamples);

      smoothedDownloadMbps = smoothValue(smoothedDownloadMbps, averagedDownload);
      smoothedUploadMbps = smoothValue(smoothedUploadMbps, averagedUpload);

      downloadEl.textContent = formatMbpsValue(smoothedDownloadMbps);
      uploadEl.textContent = formatMbpsValue(smoothedUploadMbps);

      // Update global connection stats if available
      if (globalStats) {
        activeConnectionsEl.textContent = globalStats.activeConnections || '0';
      }

      if (modeEl.value === 'download') {
        targetGaugeMbps = smoothedDownloadMbps;
      } else if (modeEl.value === 'upload') {
        targetGaugeMbps = smoothedUploadMbps;
      } else {
        targetGaugeMbps = Math.max(smoothedDownloadMbps, smoothedUploadMbps);
      }
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/speed`);
      socket.binaryType = 'arraybuffer';

      socket.onopen = () => {
        setStatus('Connected - idle');
        startPing();
      };

      socket.onmessage = (event) => {
        if (typeof event.data !== 'string') {
          return;
        }

        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }

        if (payload.type === 'metrics') {
          applyMetrics(payload.downloadBps || 0, payload.uploadBps || 0, payload.globalStats);
        }

        if (payload.type === 'pong') {
          const now = Date.now();
          latencyMs = now - payload.timestamp;
          latencyEl.textContent = `${latencyMs} ms`;
        }
      };

      socket.onclose = () => {
        isRunning = false;
        startButton.disabled = false;
        stopButton.disabled = true;
        stopUploadLoop();
        stopGaugeAnimator();
        stopPing();
        resetDisplays();
        updateGaugeModeLabel();
        setStatus('Disconnected');
      };

      socket.onerror = () => {
        setStatus('Connection error');
      };
    }

    function startTest() {
      isRunning = true;
      startButton.disabled = true;
      stopButton.disabled = false;
      updateGaugeModeLabel();
      setStatus(`Running (${modeEl.value}) - no time limit`);
      sendJson({ type: 'start', mode: modeEl.value });
      startGaugeAnimator();
      startUploadLoop();
    }

    startButton.addEventListener('click', () => {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        connect();
        const waitUntilOpen = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            clearInterval(waitUntilOpen);
            startTest();
          }
        }, 50);
        setTimeout(() => clearInterval(waitUntilOpen), 5000);
        return;
      }

      startTest();
    });

    stopButton.addEventListener('click', () => {
      isRunning = false;
      startButton.disabled = false;
      stopButton.disabled = true;
      sendJson({ type: 'stop' });
      stopUploadLoop();
      stopGaugeAnimator();
      targetGaugeMbps = 0;
      visibleGaugeMbps = 0;
      renderGauge(0);
      updateGaugeModeLabel();
      setStatus('Stopped manually');
    });

    modeEl.addEventListener('change', () => {
      updateGaugeModeLabel();
      if (!isRunning) {
        return;
      }

      sendJson({ type: 'mode', mode: modeEl.value });
      setStatus(`Running (${modeEl.value}) - no time limit`);
      if (modeEl.value === 'download') {
        targetGaugeMbps = smoothedDownloadMbps;
      } else if (modeEl.value === 'upload') {
        targetGaugeMbps = smoothedUploadMbps;
      } else {
        targetGaugeMbps = Math.max(smoothedDownloadMbps, smoothedUploadMbps);
      }
      startUploadLoop();
    });

    updateGaugeModeLabel();
    resetDisplays();
    loadNetworkInfo();
    connect();
  </script>
</body>
</html>
