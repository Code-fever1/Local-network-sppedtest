<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Network Speed Test</title>
    <style>
    :root {
      color-scheme: dark;
      --bg-1: #030712;
      --bg-2: #111827;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-a: #22d3ee;
      --accent-b: #6366f1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.15), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.15), transparent 50%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: flex;
      flex-direction: column;
    }

    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 24px 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status {
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(125, 211, 252, 0.3);
      color: #bae6fd;
      background: rgba(2, 132, 199, 0.15);
      font-weight: 600;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .gauge-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      position: relative;
    }

    .gauge {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1;
      position: relative;
    }

    .gauge svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.2));
    }

    .gaugeTrack {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 35;
    }

    .gaugeTrackDual {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .gaugeProgress {
      fill:none;
      stroke-width: 38;
      
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.4));
      transition: stroke-dasharray 0.2s linear, opacity 0.25s ease;
    }

    .gaugeProgressSingle {
      stroke: url(#gaugeGradient);
      opacity: 1;
    }

    .gauge.upload-mode .gaugeProgressSingle {
      stroke: #f97316;
      filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.45));
    }

    .gaugeProgressDownload {
      stroke: #22d3ee;
      stroke-width: 22;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.45));
    }

    .gaugeProgressUpload {
      stroke: #f97316;
      stroke-width: 22;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.45));
    }

    .gauge.dual-mode .gaugeTrack {
      stroke-width: 30;
    }

    .gauge.dual-mode .gaugeTrackDual,
    .gauge.dual-mode .gaugeProgressDownload,
    .gauge.dual-mode .gaugeProgressUpload {
      opacity: 1;
    }

    .gauge.dual-mode .gaugeProgressSingle {
      opacity: 0;
    }

    .gaugeNeedle {
      stroke: rgba(96, 96, 96, 0.406);
      stroke-width: 18;
      
      
      filter: drop-shadow(0 2px 8px rgba(15, 23, 42, 0.9));
    }

    .gaugeNeedleHub {
      fill: transparent;
    }

    .gaugeScaleLabel {
      fill: rgba(226, 232, 240, 0.78);
      font-size: 22px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0.01em;
      -webkit-user-select: none;
      user-select: none;
    }

    .gaugeCenter {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .gaugeValue {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-top: 5%;
      background: linear-gradient(to bottom right, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gaugeUnit {
      color: var(--text-muted);
      margin-top: 4px;
      font-size: 1rem;
      font-weight: 500;
    }

    .gaugeMode {



      margin-top: 70%;
      color: #818cf8;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(99, 102, 241, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: auto;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(12px);
    }

    .metric-card.full-width {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-card.full-width .metricLabel {
      margin-bottom: 0;
    }

    .metric-card.full-width .metricValue {
      font-size: 1.1rem;
      text-align: right;
    }

    .metricLabel {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metricValue {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .controls-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    }

    select {
      width: 100%;
      appearance: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 500;
      outline: none;
    }

    /* Keep native dropdown options readable on mobile browsers with light popups. */
    select option {
      color: #0f172a;
      background-color: #f8fafc;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    #start {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    #stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>Speed Test</h1>
      <div class="status" id="status">Disconnected</div>
    </header>

    <div class="gauge-section">
      <div class="gauge">
        <svg viewBox="0 0 420 420" aria-hidden="true">
          <defs>
            <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22d3ee"></stop>
              <stop offset="100%" stop-color="#818cf8"></stop>
            </linearGradient>
          </defs>
          <circle class="gaugeTrack" id="gaugeTrack" cx="210" cy="210" r="180"></circle>
          <circle class="gaugeTrack gaugeTrackDual" id="gaugeTrackDualDownload" cx="210" cy="210" r="188"></circle>
          <circle class="gaugeTrack gaugeTrackDual" id="gaugeTrackDualUpload" cx="210" cy="210" r="172"></circle>
          <circle class="gaugeProgress gaugeProgressSingle" id="gaugeProgressSingle" cx="210" cy="210" r="180"></circle>
          <circle class="gaugeProgress gaugeProgressDownload" id="gaugeProgressDownload" cx="210" cy="210" r="188"></circle>
          <circle class="gaugeProgress gaugeProgressUpload" id="gaugeProgressUpload" cx="210" cy="210" r="172"></circle>
          <g id="gaugeScaleLabels"></g>
          <line class="gaugeNeedle" id="gaugeNeedle" x1="210" y1="210" x2="340" y2="210"></line>
          <circle class="gaugeNeedleHub" cx="210" cy="210" r="12"></circle>
        </svg>
        <div class="gaugeCenter">
           <div class="gaugeMode" id="gaugeMode">Idle</div>
          <div class="gaugeValue" id="gaugeValue">0.00</div>
          <div class="gaugeUnit">Mbps</div>
          
        </div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metricLabel">Download</div>
        <div class="metricValue" id="downloadSpeed">0.00</div>
      </div>
      
      <div class="metric-card">
        <div class="metricLabel">Upload</div>
        <div class="metricValue" id="uploadSpeed">0.00</div>
      </div>

      <div class="metric-card">
        <div class="metricLabel">Ping</div>
        <div class="metricValue" id="latency">--</div>
      </div>

      <div class="metric-card">
        <div class="metricLabel">Connections</div>
        <div class="metricValue" id="activeConnections">0</div>
      </div>

      <div class="metric-card full-width">
        <div class="metricLabel">Interface</div>
        <div class="metricValue" id="networkInterface" style="font-size: 0.95rem; font-weight: 500; max-width: 60%; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; color: var(--text-muted)">Loading...</div>
      </div>
    </div>

    <div class="controls-section">
      <select id="mode" title="Test mode">
        <option value="download" selected>Download</option>
        <option value="upload">Upload</option>
        <option value="both">Both</option>
      </select>

      <select id="gaugeRange" title="Gauge max range">
        <option value="20">20 Mbps Meter</option>
        <option value="50">50 Mbps Meter</option>
        <option value="100">100 Mbps Meter</option>
        <option value="300">300 Mbps Meter</option>
        <option value="500" selected>500 Mbps Meter</option>
        <option value="1000">1000 Mbps Meter</option>
      </select>

      <div class="action-buttons">
        <button id="start">Start Test</button>
        <button id="stop" disabled>Stop Test</button>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const downloadEl = document.getElementById('downloadSpeed');
    const uploadEl = document.getElementById('uploadSpeed');
    const latencyEl = document.getElementById('latency');
    const networkInterfaceEl = document.getElementById('networkInterface');
    const activeConnectionsEl = document.getElementById('activeConnections');
    const gaugeEl = document.querySelector('.gauge');
    const gaugeTrackEl = document.getElementById('gaugeTrack');
    const gaugeTrackDualDownloadEl = document.getElementById('gaugeTrackDualDownload');
    const gaugeTrackDualUploadEl = document.getElementById('gaugeTrackDualUpload');
    const gaugeProgressSingleEl = document.getElementById('gaugeProgressSingle');
    const gaugeProgressDownloadEl = document.getElementById('gaugeProgressDownload');
    const gaugeProgressUploadEl = document.getElementById('gaugeProgressUpload');
    const gaugeScaleLabelsEl = document.getElementById('gaugeScaleLabels');
    const gaugeNeedleEl = document.getElementById('gaugeNeedle');
    const gaugeValueEl = document.getElementById('gaugeValue');
    const gaugeModeEl = document.getElementById('gaugeMode');
    const modeEl = document.getElementById('mode');
    const gaugeRangeEl = document.getElementById('gaugeRange');
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');

    const uploadChunk = new Uint8Array(64 * 1024).fill(97);
    const UPLOAD_PUMP_PROFILE_SINGLE = {
      lowBufferBytes: 512 * 1024,
      highBufferBytes: 1.5 * 1024 * 1024,
      maxPacketsPerPump: 16,
      activeDelayMs: 1,
      backpressureDelayMs: 4,
    };
    const UPLOAD_PUMP_PROFILE_BOTH = {
      lowBufferBytes: 192 * 1024,
      highBufferBytes: 768 * 1024,
      maxPacketsPerPump: 6,
      activeDelayMs: 2,
      backpressureDelayMs: 6,
    };

    const GAUGE_SCALE_STEP_BY_MAX = {
      20: 5,
      50: 10,
      100: 20,
      300: 50,
      500: 100,
      1000: 200,
    };
    const GAUGE_CENTER = 210;
    const GAUGE_START_ANGLE_DEG = 133.2;
    const GAUGE_SWEEP_RATIO = 0.76;
    const GAUGE_SWEEP_DEG = 360 * GAUGE_SWEEP_RATIO;
    const GAUGE_LABEL_RADIUS = 138;
    const GAUGE_GEOMETRY = {
      single: {
        radius: 180,
        circumference: 2 * Math.PI * 180,
      },
      download: {
        radius: 188,
        circumference: 2 * Math.PI * 188,
      },
      upload: {
        radius: 172,
        circumference: 2 * Math.PI * 172,
      }
    };
    GAUGE_GEOMETRY.single.arcLength = GAUGE_GEOMETRY.single.circumference * GAUGE_SWEEP_RATIO;
    GAUGE_GEOMETRY.download.arcLength = GAUGE_GEOMETRY.download.circumference * GAUGE_SWEEP_RATIO;
    GAUGE_GEOMETRY.upload.arcLength = GAUGE_GEOMETRY.upload.circumference * GAUGE_SWEEP_RATIO;

    const DISPLAY_SMOOTH_ALPHA_UP = 0.22;
    const DISPLAY_SMOOTH_ALPHA_DOWN = 0.1;
    const GAUGE_LERP_FACTOR = 0.16;
    const SPEED_WINDOW_SIZE = 12;
    const ZERO_DROP_PROTECT_THRESHOLD_MBPS = 40;
    const ZERO_DROP_DECAY = 0.9;

    let socket = null;
    let isRunning = false;
    let uploadPumpTimer = null;
    let gaugeAnimationId = null;
    let pingInterval = null;

    let smoothedDownloadMbps = 0;
    let smoothedUploadMbps = 0;
    let targetGaugeSingleMbps = 0;
    let visibleGaugeSingleMbps = 0;
    let targetGaugeDownloadMbps = 0;
    let visibleGaugeDownloadMbps = 0;
    let targetGaugeUploadMbps = 0;
    let visibleGaugeUploadMbps = 0;
    let latencyMs = 0;
    let downloadSamples = [];
    let uploadSamples = [];
    let gaugeMaxMbps = Number(gaugeRangeEl.value);
    let clientDownloadBytes = 0;
    let clientDownloadLastAt = Date.now();

    function getGaugeScaleValues(maxMbps) {
      const safeMax = Number.isFinite(maxMbps) && maxMbps > 0 ? maxMbps : 500;
      const step = GAUGE_SCALE_STEP_BY_MAX[safeMax] || Math.max(1, Math.round(safeMax / 5));
      const values = [];

      for (let value = 0; value <= safeMax; value += step) {
        values.push(value);
      }

      if (values[values.length - 1] !== safeMax) {
        values.push(safeMax);
      }

      return values;
    }

    function setGaugeMax(nextMaxMbps) {
      if (!Number.isFinite(nextMaxMbps) || nextMaxMbps <= 0) {
        return;
      }

      gaugeMaxMbps = nextMaxMbps;
      renderGaugeScaleLabels();
      setGaugeTargetsFromMode();
      renderGauge();
    }

    function configureGaugeArc(element, geometry, isTrack = false) {
      element.setAttribute('transform', `rotate(${GAUGE_START_ANGLE_DEG} ${GAUGE_CENTER} ${GAUGE_CENTER})`);
      if (isTrack) {
        element.style.strokeDasharray = `${geometry.arcLength} ${geometry.circumference}`;
      } else {
        element.style.strokeDasharray = `0 ${geometry.circumference}`;
      }
      element.style.strokeDashoffset = '0';
    }

    function setGaugeArcProgress(element, geometry, mbps) {
      const safeMax = Math.max(gaugeMaxMbps, 1);
      const clamped = Math.max(0, Math.min(mbps, safeMax));
      const ratio = clamped / safeMax;
      const visibleArc = geometry.arcLength * ratio;
      element.style.strokeDasharray = `${visibleArc} ${geometry.circumference}`;
      return clamped;
    }

    function polarToCartesian(angleDeg, radius) {
      const radians = (angleDeg * Math.PI) / 180;
      return {
        x: GAUGE_CENTER + Math.cos(radians) * radius,
        y: GAUGE_CENTER + Math.sin(radians) * radius,
      };
    }

    function renderGaugeScaleLabels() {
      if (!gaugeScaleLabelsEl) {
        return;
      }

      const scaleValues = getGaugeScaleValues(gaugeMaxMbps);
      gaugeScaleLabelsEl.textContent = '';

      for (const value of scaleValues) {
        const ratio = value / gaugeMaxMbps;
        const angle = GAUGE_START_ANGLE_DEG + ratio * GAUGE_SWEEP_DEG;
        const point = polarToCartesian(angle, GAUGE_LABEL_RADIUS);
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'gaugeScaleLabel');
        label.setAttribute('x', point.x.toFixed(1));
        label.setAttribute('y', point.y.toFixed(1));
        label.textContent = String(value);
        gaugeScaleLabelsEl.appendChild(label);
      }
    }

    configureGaugeArc(gaugeTrackEl, GAUGE_GEOMETRY.single, true);
    configureGaugeArc(gaugeTrackDualDownloadEl, GAUGE_GEOMETRY.download, true);
    configureGaugeArc(gaugeTrackDualUploadEl, GAUGE_GEOMETRY.upload, true);
    configureGaugeArc(gaugeProgressSingleEl, GAUGE_GEOMETRY.single);
    configureGaugeArc(gaugeProgressDownloadEl, GAUGE_GEOMETRY.download);
    configureGaugeArc(gaugeProgressUploadEl, GAUGE_GEOMETRY.upload);
    renderGaugeScaleLabels();

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function smoothValue(current, next) {
      const alpha = next >= current ? DISPLAY_SMOOTH_ALPHA_UP : DISPLAY_SMOOTH_ALPHA_DOWN;
      return current + alpha * (next - current);
    }

    function formatMbpsValue(mbps) {
      return `${mbps.toFixed(2)} Mbps`;
    }

    function pushSample(samples, value) {
      samples.push(value);
      if (samples.length > SPEED_WINDOW_SIZE) {
        samples.shift();
      }
    }

    function averageSamples(samples) {
      if (samples.length === 0) {
        return 0;
      }
      const total = samples.reduce((sum, item) => sum + item, 0);
      return total / samples.length;
    }

    function stabilizeDropToZero(rawMbps, previousSmoothedMbps) {
      if (rawMbps < 1 && previousSmoothedMbps >= ZERO_DROP_PROTECT_THRESHOLD_MBPS) {
        return previousSmoothedMbps * ZERO_DROP_DECAY;
      }
      return rawMbps;
    }

    function renderGauge() {
      gaugeEl.classList.toggle('dual-mode', modeEl.value === 'both');
      gaugeEl.classList.toggle('upload-mode', modeEl.value === 'upload');

      const displayValue = setGaugeArcProgress(gaugeProgressSingleEl, GAUGE_GEOMETRY.single, visibleGaugeSingleMbps);
      setGaugeArcProgress(gaugeProgressDownloadEl, GAUGE_GEOMETRY.download, visibleGaugeDownloadMbps);
      setGaugeArcProgress(gaugeProgressUploadEl, GAUGE_GEOMETRY.upload, visibleGaugeUploadMbps);

      gaugeValueEl.textContent = displayValue.toFixed(2);

      if (gaugeNeedleEl) {
        const safeMax = Math.max(gaugeMaxMbps, 1);
        const ratio = Math.max(0, Math.min(displayValue, safeMax)) / safeMax;
        const angle = GAUGE_START_ANGLE_DEG + ratio * GAUGE_SWEEP_DEG;
        gaugeNeedleEl.setAttribute('transform', `rotate(${angle} ${GAUGE_CENTER} ${GAUGE_CENTER})`);
      }
    }

    function startGaugeAnimator() {
      if (gaugeAnimationId) {
        return;
      }

      const frame = () => {
        visibleGaugeSingleMbps += (targetGaugeSingleMbps - visibleGaugeSingleMbps) * GAUGE_LERP_FACTOR;
        visibleGaugeDownloadMbps += (targetGaugeDownloadMbps - visibleGaugeDownloadMbps) * GAUGE_LERP_FACTOR;
        visibleGaugeUploadMbps += (targetGaugeUploadMbps - visibleGaugeUploadMbps) * GAUGE_LERP_FACTOR;

        if (Math.abs(visibleGaugeSingleMbps - targetGaugeSingleMbps) < 0.03) {
          visibleGaugeSingleMbps = targetGaugeSingleMbps;
        }
        if (Math.abs(visibleGaugeDownloadMbps - targetGaugeDownloadMbps) < 0.03) {
          visibleGaugeDownloadMbps = targetGaugeDownloadMbps;
        }
        if (Math.abs(visibleGaugeUploadMbps - targetGaugeUploadMbps) < 0.03) {
          visibleGaugeUploadMbps = targetGaugeUploadMbps;
        }

        renderGauge();
        gaugeAnimationId = requestAnimationFrame(frame);
      };

      gaugeAnimationId = requestAnimationFrame(frame);
    }

    function stopGaugeAnimator() {
      if (!gaugeAnimationId) {
        return;
      }
      cancelAnimationFrame(gaugeAnimationId);
      gaugeAnimationId = null;
    }

    function updateGaugeModeLabel() {
      if (!isRunning) {
        gaugeModeEl.textContent = 'Idle';
        return;
      }

      if (modeEl.value === 'upload') {
        gaugeModeEl.textContent = 'Upload';
        return;
      }

      if (modeEl.value === 'download') {
        gaugeModeEl.textContent = 'Download';
        return;
      }

      gaugeModeEl.textContent = 'Both';
    }

    function isUploadModeEnabled() {
      return modeEl.value === 'upload' || modeEl.value === 'both';
    }

    function isDownloadModeEnabled() {
      return modeEl.value === 'download' || modeEl.value === 'both';
    }

    function isDualModeEnabled() {
      return modeEl.value === 'both';
    }

    function getUploadPumpProfile() {
      return isDualModeEnabled() ? UPLOAD_PUMP_PROFILE_BOTH : UPLOAD_PUMP_PROFILE_SINGLE;
    }

    function measureBinaryPayloadBytes(data) {
      if (typeof data === 'string') {
        return 0;
      }

      if (data instanceof ArrayBuffer) {
        return data.byteLength;
      }

      if (data instanceof Blob) {
        return data.size;
      }

      if (ArrayBuffer.isView(data)) {
        return data.byteLength;
      }

      return 0;
    }

    function consumeClientDownloadBps() {
      const now = Date.now();
      const elapsedMs = Math.max(now - clientDownloadLastAt, 1);
      const bps = clientDownloadBytes * (1000 / elapsedMs);
      clientDownloadBytes = 0;
      clientDownloadLastAt = now;
      return bps;
    }

    function setGaugeTargetsFromMode() {
      if (isDualModeEnabled()) {
        targetGaugeSingleMbps = smoothedDownloadMbps + smoothedUploadMbps;
        targetGaugeDownloadMbps = smoothedDownloadMbps;
        targetGaugeUploadMbps = smoothedUploadMbps;
        return;
      }

      if (modeEl.value === 'download') {
        targetGaugeSingleMbps = smoothedDownloadMbps;
        targetGaugeDownloadMbps = 0;
        targetGaugeUploadMbps = 0;
        return;
      }

      targetGaugeSingleMbps = smoothedUploadMbps;
      targetGaugeDownloadMbps = 0;
      targetGaugeUploadMbps = 0;
    }

    function resetDisplays() {
      smoothedDownloadMbps = 0;
      smoothedUploadMbps = 0;
      targetGaugeSingleMbps = 0;
      visibleGaugeSingleMbps = 0;
      targetGaugeDownloadMbps = 0;
      visibleGaugeDownloadMbps = 0;
      targetGaugeUploadMbps = 0;
      visibleGaugeUploadMbps = 0;
      latencyMs = 0;
      downloadSamples = [];
      uploadSamples = [];
      clientDownloadBytes = 0;
      clientDownloadLastAt = Date.now();
      downloadEl.textContent = formatMbpsValue(0);
      uploadEl.textContent = formatMbpsValue(0);
      latencyEl.textContent = '-- ms';
      activeConnectionsEl.textContent = '0';
      renderGauge();
    }

    function sendJson(message) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }
      socket.send(JSON.stringify(message));
    }

    function startPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
      }

      pingInterval = setInterval(() => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          sendJson({
            type: 'ping',
            timestamp: Date.now()
          });
        }
      }, 2000); // Ping every 2 seconds
    }

    function stopPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }
    }

    async function loadNetworkInfo() {
      try {
        const response = await fetch('/network-info');
        const data = await response.json();

        const activeInterfaces = Object.entries(data.interfaces)
          .filter(([name, interfaces]) =>
            interfaces.some(iface => iface.family === 'IPv4' && !iface.internal)
          );

        if (activeInterfaces.length > 0) {
          const interfaceNames = activeInterfaces.map(([name]) => name).join(', ');
          networkInterfaceEl.textContent = interfaceNames;
        } else {
          networkInterfaceEl.textContent = 'No network detected';
        }
      } catch (error) {
        networkInterfaceEl.textContent = 'Unknown';
      }
    }

    function stopUploadLoop() {
      if (uploadPumpTimer !== null) {
        clearTimeout(uploadPumpTimer);
        uploadPumpTimer = null;
      }
    }

    function scheduleUploadPump() {
      if (uploadPumpTimer !== null) {
        return;
      }

      uploadPumpTimer = setTimeout(() => {
        uploadPumpTimer = null;
        runUploadPump();
      }, 0);
    }

    function runUploadPump() {
      if (!isRunning || !socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }

      if (!isUploadModeEnabled()) {
        return;
      }

      const profile = getUploadPumpProfile();

      if (socket.bufferedAmount >= profile.highBufferBytes) {
        uploadPumpTimer = setTimeout(() => {
          uploadPumpTimer = null;
          runUploadPump();
        }, profile.backpressureDelayMs);
        return;
      }

      let packetsSent = 0;
      while (
        socket.bufferedAmount < profile.lowBufferBytes &&
        packetsSent < profile.maxPacketsPerPump &&
        isRunning &&
        socket.readyState === WebSocket.OPEN
      ) {
        socket.send(uploadChunk);
        packetsSent += 1;
      }

      uploadPumpTimer = setTimeout(() => {
        uploadPumpTimer = null;
        runUploadPump();
      }, profile.activeDelayMs);
    }

    function startUploadLoop() {
      stopUploadLoop();
      if (isUploadModeEnabled()) {
        scheduleUploadPump();
      }
    }

    function applyMetrics(downloadBps, uploadBps, globalStats) {
      const rawDownloadMbps = (downloadBps * 8) / 1_000_000;
      const rawUploadMbps = (uploadBps * 8) / 1_000_000;

      const stabilizedDownload = stabilizeDropToZero(rawDownloadMbps, smoothedDownloadMbps);
      const stabilizedUpload = stabilizeDropToZero(rawUploadMbps, smoothedUploadMbps);

      pushSample(downloadSamples, stabilizedDownload);
      pushSample(uploadSamples, stabilizedUpload);

      const averagedDownload = averageSamples(downloadSamples);
      const averagedUpload = averageSamples(uploadSamples);

      smoothedDownloadMbps = smoothValue(smoothedDownloadMbps, averagedDownload);
      smoothedUploadMbps = smoothValue(smoothedUploadMbps, averagedUpload);

      downloadEl.textContent = formatMbpsValue(smoothedDownloadMbps);
      uploadEl.textContent = formatMbpsValue(smoothedUploadMbps);

      // Update global connection stats if available
      if (globalStats) {
        activeConnectionsEl.textContent = globalStats.activeConnections || '0';
      }

      setGaugeTargetsFromMode();
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/speed`);
      socket.binaryType = 'blob';

      socket.onopen = () => {
        setStatus('Connected - idle');
        startPing();
      };

      socket.onmessage = (event) => {
        if (typeof event.data !== 'string') {
          if (isRunning && isDownloadModeEnabled()) {
            clientDownloadBytes += measureBinaryPayloadBytes(event.data);
          }
          return;
        }

        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }

        if (payload.type === 'metrics') {
          const measuredClientDownloadBps = isDownloadModeEnabled() ? consumeClientDownloadBps() : 0;
          applyMetrics(measuredClientDownloadBps, payload.uploadBps || 0, payload.globalStats);
        }

        if (payload.type === 'pong') {
          const now = Date.now();
          latencyMs = now - payload.timestamp;
          latencyEl.textContent = `${latencyMs} ms`;
        }
      };

      socket.onclose = () => {
        isRunning = false;
        startButton.disabled = false;
        stopButton.disabled = true;
        stopUploadLoop();
        stopGaugeAnimator();
        stopPing();
        resetDisplays();
        updateGaugeModeLabel();
        setStatus('Disconnected');
      };

      socket.onerror = () => {
        setStatus('Connection error');
      };
    }

    function startTest() {
      isRunning = true;
      clientDownloadBytes = 0;
      clientDownloadLastAt = Date.now();
      startButton.disabled = true;
      stopButton.disabled = false;
      updateGaugeModeLabel();
      setStatus(`Running (${modeEl.value}) - no time limit`);
      sendJson({ type: 'start', mode: modeEl.value });
      startGaugeAnimator();
      startUploadLoop();
    }

    startButton.addEventListener('click', () => {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        connect();
        const waitUntilOpen = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            clearInterval(waitUntilOpen);
            startTest();
          }
        }, 50);
        setTimeout(() => clearInterval(waitUntilOpen), 5000);
        return;
      }

      startTest();
    });

    stopButton.addEventListener('click', () => {
      isRunning = false;
      startButton.disabled = false;
      stopButton.disabled = true;
      sendJson({ type: 'stop' });
      stopUploadLoop();
      stopGaugeAnimator();
      targetGaugeSingleMbps = 0;
      visibleGaugeSingleMbps = 0;
      targetGaugeDownloadMbps = 0;
      visibleGaugeDownloadMbps = 0;
      targetGaugeUploadMbps = 0;
      visibleGaugeUploadMbps = 0;
      renderGauge();
      updateGaugeModeLabel();
      setStatus('Stopped manually');
    });

    modeEl.addEventListener('change', () => {
      updateGaugeModeLabel();
      if (!isRunning) {
        return;
      }

      sendJson({ type: 'mode', mode: modeEl.value });
      setStatus(`Running (${modeEl.value}) - no time limit`);
      setGaugeTargetsFromMode();
      renderGauge();
      startUploadLoop();
    });

    gaugeRangeEl.addEventListener('change', () => {
      const nextMax = Number(gaugeRangeEl.value);
      setGaugeMax(nextMax);
    });

    updateGaugeModeLabel();
    setGaugeMax(gaugeMaxMbps);
    resetDisplays();
    loadNetworkInfo();
    connect();
  </script>
</body>
</html>
