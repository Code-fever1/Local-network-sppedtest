<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Network Speed Test</title>
    <style>
    :root {
      color-scheme: dark;
      --bg-1: #030712;
      --bg-2: #111827;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-a: #22d3ee;
      --accent-b: #6366f1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.15), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.15), transparent 50%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: flex;
      flex-direction: column;
    }

    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 24px 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status {
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(125, 211, 252, 0.3);
      color: #bae6fd;
      background: rgba(2, 132, 199, 0.15);
      font-weight: 600;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .gauge-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      position: relative;
    }

    .gauge {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1;
      position: relative;
    }

    .gauge svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.2));
    }

    .gaugeTrack {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 18;
    }

    .gaugeProgress {
      fill: none;
      stroke-width: 18;
      stroke-linecap: round;
      stroke: url(#gaugeGradient);
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.4));
      transition: stroke-dashoffset 0.1s linear;
    }

    .gaugeCenter {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .gaugeValue {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(to bottom right, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gaugeUnit {
      color: var(--text-muted);
      margin-top: 4px;
      font-size: 1rem;
      font-weight: 500;
    }

    .gaugeMode {
      margin-top: 12px;
      color: #818cf8;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(99, 102, 241, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: auto;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(12px);
    }

    .metric-card.full-width {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-card.full-width .metricLabel {
      margin-bottom: 0;
    }

    .metric-card.full-width .metricValue {
      font-size: 1.1rem;
      text-align: right;
    }

    .metricLabel {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metricValue {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .controls-section {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    }

    select {
      width: 100%;
      appearance: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
      color: white;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    #start {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    #stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>Speed Test</h1>
      <div class="status" id="status">Disconnected</div>
    </header>

    <div class="gauge-section">
      <div class="gauge">
        <svg viewBox="0 0 420 420" aria-hidden="true">
          <defs>
            <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22d3ee"></stop>
              <stop offset="100%" stop-color="#818cf8"></stop>
            </linearGradient>
          </defs>
          <circle class="gaugeTrack" cx="210" cy="210" r="180"></circle>
          <circle class="gaugeProgress" id="gaugeProgress" cx="210" cy="210" r="180"></circle>
        </svg>
        <div class="gaugeCenter">
          <div class="gaugeValue" id="gaugeValue">0.00</div>
          <div class="gaugeUnit">Mbps</div>
          <div class="gaugeMode" id="gaugeMode">Idle</div>
        </div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metricLabel">Download</div>
        <div class="metricValue" id="downloadSpeed">0.00</div>
      </div>
      
      <div class="metric-card">
        <div class="metricLabel">Upload</div>
        <div class="metricValue" id="uploadSpeed">0.00</div>
      </div>

      <div class="metric-card">
        <div class="metricLabel">Ping</div>
        <div class="metricValue" id="latency">--</div>
      </div>

      <div class="metric-card">
        <div class="metricLabel">Connections</div>
        <div class="metricValue" id="activeConnections">0</div>
      </div>

      <div class="metric-card full-width">
        <div class="metricLabel">Interface</div>
        <div class="metricValue" id="networkInterface" style="font-size: 0.95rem; font-weight: 500; max-width: 60%; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; color: var(--text-muted)">Loading...</div>
      </div>
    </div>

    <div class="controls-section">
      <select id="mode">
        <option value="both">Both (Upload + Download)</option>
        <option value="download">Download only</option>
        <option value="upload">Upload only</option>
      </select>

      <div class="action-buttons">
        <button id="start">Start Test</button>
        <button id="stop" disabled>Stop Test</button>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const downloadEl = document.getElementById('downloadSpeed');
    const uploadEl = document.getElementById('uploadSpeed');
    const latencyEl = document.getElementById('latency');
    const networkInterfaceEl = document.getElementById('networkInterface');
    const activeConnectionsEl = document.getElementById('activeConnections');
    const gaugeProgressEl = document.getElementById('gaugeProgress');
    const gaugeValueEl = document.getElementById('gaugeValue');
    const gaugeModeEl = document.getElementById('gaugeMode');
    const modeEl = document.getElementById('mode');
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');

    const uploadChunk = new Uint8Array(64 * 1024).fill(97);
    const UPLOAD_BUFFER_LOW_BYTES = 512 * 1024;
    const UPLOAD_BUFFER_HIGH_BYTES = 1.5 * 1024 * 1024;
    const MAX_PACKETS_PER_PUMP = 16;
    const PUMP_DELAY_ACTIVE_MS = 1;
    const PUMP_DELAY_BACKPRESSURE_MS = 4;

    const GAUGE_MAX_MBPS = 500;
    const GAUGE_RADIUS = 180;
    const GAUGE_CIRCUMFERENCE = 2 * Math.PI * GAUGE_RADIUS;

    const DISPLAY_SMOOTH_ALPHA_UP = 0.22;
    const DISPLAY_SMOOTH_ALPHA_DOWN = 0.1;
    const GAUGE_LERP_FACTOR = 0.16;
    const SPEED_WINDOW_SIZE = 12;
    const ZERO_DROP_PROTECT_THRESHOLD_MBPS = 40;
    const ZERO_DROP_DECAY = 0.9;

    let socket = null;
    let isRunning = false;
    let uploadPumpTimer = null;
    let gaugeAnimationId = null;
    let pingInterval = null;

    let smoothedDownloadMbps = 0;
    let smoothedUploadMbps = 0;
    let targetGaugeMbps = 0;
    let visibleGaugeMbps = 0;
    let latencyMs = 0;
    let downloadSamples = [];
    let uploadSamples = [];

    gaugeProgressEl.style.strokeDasharray = `${GAUGE_CIRCUMFERENCE}`;
    gaugeProgressEl.style.strokeDashoffset = `${GAUGE_CIRCUMFERENCE}`;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function smoothValue(current, next) {
      const alpha = next >= current ? DISPLAY_SMOOTH_ALPHA_UP : DISPLAY_SMOOTH_ALPHA_DOWN;
      return current + alpha * (next - current);
    }

    function formatMbpsValue(mbps) {
      return `${mbps.toFixed(2)} Mbps`;
    }

    function pushSample(samples, value) {
      samples.push(value);
      if (samples.length > SPEED_WINDOW_SIZE) {
        samples.shift();
      }
    }

    function averageSamples(samples) {
      if (samples.length === 0) {
        return 0;
      }
      const total = samples.reduce((sum, item) => sum + item, 0);
      return total / samples.length;
    }

    function stabilizeDropToZero(rawMbps, previousSmoothedMbps) {
      if (rawMbps < 1 && previousSmoothedMbps >= ZERO_DROP_PROTECT_THRESHOLD_MBPS) {
        return previousSmoothedMbps * ZERO_DROP_DECAY;
      }
      return rawMbps;
    }

    function renderGauge(mbps) {
      const clamped = Math.max(0, Math.min(mbps, GAUGE_MAX_MBPS));
      const ratio = clamped / GAUGE_MAX_MBPS;
      const offset = GAUGE_CIRCUMFERENCE * (1 - ratio);
      gaugeProgressEl.style.strokeDashoffset = `${offset}`;
      gaugeValueEl.textContent = mbps.toFixed(2);
    }

    function startGaugeAnimator() {
      if (gaugeAnimationId) {
        return;
      }

      const frame = () => {
        visibleGaugeMbps += (targetGaugeMbps - visibleGaugeMbps) * GAUGE_LERP_FACTOR;
        if (Math.abs(visibleGaugeMbps - targetGaugeMbps) < 0.03) {
          visibleGaugeMbps = targetGaugeMbps;
        }
        renderGauge(visibleGaugeMbps);
        gaugeAnimationId = requestAnimationFrame(frame);
      };

      gaugeAnimationId = requestAnimationFrame(frame);
    }

    function stopGaugeAnimator() {
      if (!gaugeAnimationId) {
        return;
      }
      cancelAnimationFrame(gaugeAnimationId);
      gaugeAnimationId = null;
    }

    function updateGaugeModeLabel() {
      if (!isRunning) {
        gaugeModeEl.textContent = 'Idle';
        return;
      }

      if (modeEl.value === 'upload') {
        gaugeModeEl.textContent = 'Upload';
        return;
      }

      if (modeEl.value === 'download') {
        gaugeModeEl.textContent = 'Download';
        return;
      }

      gaugeModeEl.textContent = 'Both (Higher of two)';
    }

    function resetDisplays() {
      smoothedDownloadMbps = 0;
      smoothedUploadMbps = 0;
      targetGaugeMbps = 0;
      visibleGaugeMbps = 0;
      latencyMs = 0;
      downloadSamples = [];
      uploadSamples = [];
      downloadEl.textContent = formatMbpsValue(0);
      uploadEl.textContent = formatMbpsValue(0);
      latencyEl.textContent = '-- ms';
      activeConnectionsEl.textContent = '0';
      renderGauge(0);
    }

    function sendJson(message) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }
      socket.send(JSON.stringify(message));
    }

    function startPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
      }

      pingInterval = setInterval(() => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          sendJson({
            type: 'ping',
            timestamp: Date.now()
          });
        }
      }, 2000); // Ping every 2 seconds
    }

    function stopPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }
    }

    async function loadNetworkInfo() {
      try {
        const response = await fetch('/network-info');
        const data = await response.json();

        const activeInterfaces = Object.entries(data.interfaces)
          .filter(([name, interfaces]) =>
            interfaces.some(iface => iface.family === 'IPv4' && !iface.internal)
          );

        if (activeInterfaces.length > 0) {
          const interfaceNames = activeInterfaces.map(([name]) => name).join(', ');
          networkInterfaceEl.textContent = interfaceNames;
        } else {
          networkInterfaceEl.textContent = 'No network detected';
        }
      } catch (error) {
        networkInterfaceEl.textContent = 'Unknown';
      }
    }

    function stopUploadLoop() {
      if (uploadPumpTimer !== null) {
        clearTimeout(uploadPumpTimer);
        uploadPumpTimer = null;
      }
    }

    function scheduleUploadPump() {
      if (uploadPumpTimer !== null) {
        return;
      }

      uploadPumpTimer = setTimeout(() => {
        uploadPumpTimer = null;
        runUploadPump();
      }, 0);
    }

    function runUploadPump() {
      if (!isRunning || !socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }

      const mode = modeEl.value;
      if (mode !== 'upload' && mode !== 'both') {
        return;
      }

      if (socket.bufferedAmount >= UPLOAD_BUFFER_HIGH_BYTES) {
        uploadPumpTimer = setTimeout(() => {
          uploadPumpTimer = null;
          runUploadPump();
        }, PUMP_DELAY_BACKPRESSURE_MS);
        return;
      }

      let packetsSent = 0;
      while (
        socket.bufferedAmount < UPLOAD_BUFFER_LOW_BYTES &&
        packetsSent < MAX_PACKETS_PER_PUMP &&
        isRunning &&
        socket.readyState === WebSocket.OPEN
      ) {
        socket.send(uploadChunk);
        packetsSent += 1;
      }

      uploadPumpTimer = setTimeout(() => {
        uploadPumpTimer = null;
        runUploadPump();
      }, PUMP_DELAY_ACTIVE_MS);
    }

    function startUploadLoop() {
      stopUploadLoop();
      scheduleUploadPump();
    }

    function applyMetrics(downloadBps, uploadBps, globalStats) {
      const rawDownloadMbps = (downloadBps * 8) / 1_000_000;
      const rawUploadMbps = (uploadBps * 8) / 1_000_000;

      const stabilizedDownload = stabilizeDropToZero(rawDownloadMbps, smoothedDownloadMbps);
      const stabilizedUpload = stabilizeDropToZero(rawUploadMbps, smoothedUploadMbps);

      pushSample(downloadSamples, stabilizedDownload);
      pushSample(uploadSamples, stabilizedUpload);

      const averagedDownload = averageSamples(downloadSamples);
      const averagedUpload = averageSamples(uploadSamples);

      smoothedDownloadMbps = smoothValue(smoothedDownloadMbps, averagedDownload);
      smoothedUploadMbps = smoothValue(smoothedUploadMbps, averagedUpload);

      downloadEl.textContent = formatMbpsValue(smoothedDownloadMbps);
      uploadEl.textContent = formatMbpsValue(smoothedUploadMbps);

      // Update global connection stats if available
      if (globalStats) {
        activeConnectionsEl.textContent = globalStats.activeConnections || '0';
      }

      if (modeEl.value === 'download') {
        targetGaugeMbps = smoothedDownloadMbps;
      } else if (modeEl.value === 'upload') {
        targetGaugeMbps = smoothedUploadMbps;
      } else {
        targetGaugeMbps = Math.max(smoothedDownloadMbps, smoothedUploadMbps);
      }
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/speed`);
      socket.binaryType = 'arraybuffer';

      socket.onopen = () => {
        setStatus('Connected - idle');
        startPing();
      };

      socket.onmessage = (event) => {
        if (typeof event.data !== 'string') {
          return;
        }

        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }

        if (payload.type === 'metrics') {
          applyMetrics(payload.downloadBps || 0, payload.uploadBps || 0, payload.globalStats);
        }

        if (payload.type === 'pong') {
          const now = Date.now();
          latencyMs = now - payload.timestamp;
          latencyEl.textContent = `${latencyMs} ms`;
        }
      };

      socket.onclose = () => {
        isRunning = false;
        startButton.disabled = false;
        stopButton.disabled = true;
        stopUploadLoop();
        stopGaugeAnimator();
        stopPing();
        resetDisplays();
        updateGaugeModeLabel();
        setStatus('Disconnected');
      };

      socket.onerror = () => {
        setStatus('Connection error');
      };
    }

    function startTest() {
      isRunning = true;
      startButton.disabled = true;
      stopButton.disabled = false;
      updateGaugeModeLabel();
      setStatus(`Running (${modeEl.value}) - no time limit`);
      sendJson({ type: 'start', mode: modeEl.value });
      startGaugeAnimator();
      startUploadLoop();
    }

    startButton.addEventListener('click', () => {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        connect();
        const waitUntilOpen = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            clearInterval(waitUntilOpen);
            startTest();
          }
        }, 50);
        setTimeout(() => clearInterval(waitUntilOpen), 5000);
        return;
      }

      startTest();
    });

    stopButton.addEventListener('click', () => {
      isRunning = false;
      startButton.disabled = false;
      stopButton.disabled = true;
      sendJson({ type: 'stop' });
      stopUploadLoop();
      stopGaugeAnimator();
      targetGaugeMbps = 0;
      visibleGaugeMbps = 0;
      renderGauge(0);
      updateGaugeModeLabel();
      setStatus('Stopped manually');
    });

    modeEl.addEventListener('change', () => {
      updateGaugeModeLabel();
      if (!isRunning) {
        return;
      }

      sendJson({ type: 'mode', mode: modeEl.value });
      setStatus(`Running (${modeEl.value}) - no time limit`);
      if (modeEl.value === 'download') {
        targetGaugeMbps = smoothedDownloadMbps;
      } else if (modeEl.value === 'upload') {
        targetGaugeMbps = smoothedUploadMbps;
      } else {
        targetGaugeMbps = Math.max(smoothedDownloadMbps, smoothedUploadMbps);
      }
      startUploadLoop();
    });

    updateGaugeModeLabel();
    resetDisplays();
    loadNetworkInfo();
    connect();
  </script>
</body>
</html>
